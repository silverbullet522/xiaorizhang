name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        id: upload
        with:
          path: dist
      - name: Wait for Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          artifact_list="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages"
          for attempt in {1..12}; do
            if ids=$(gh api "$artifact_list" --jq '.artifacts[] | select(.expired == false) | .id') &&
               grep -Fxq "$ARTIFACT_ID" <<< "$ids"; then
              exit 0
            fi
            sleep 5
          done
          echo 'The Pages artifact is still missing from the run artifact list.' >&2
          exit 1
      - id: deployment
        uses: actions/deploy-pages@v4
