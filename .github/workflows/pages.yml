name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        id: upload
        with:
          path: dist
      - name: Wait for Pages artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          artifact_list="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages"
          for attempt in {1..12}; do
            if ids=$(gh api "$artifact_list" --jq '.artifacts[] | select(.expired == false) | .id') &&
               grep -Fxq "$ARTIFACT_ID" <<< "$ids"; then
              exit 0
            fi
            sleep 5
          done
          echo 'The Pages artifact is still missing from the run artifact list.' >&2
          exit 1
      - name: Deploy the uploaded Pages artifact
        id: deployment
        shell: bash
        timeout-minutes: 11
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          # Deploy by the exact artifact ID because the runner's artifact name lookup can lag.
          pages="repos/$GITHUB_REPOSITORY/pages/deployments"
          oidc_token=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -er '.value')
          echo "::add-mask::$oidc_token"
          deployment=$(gh api --method POST "$pages" -F "artifact_id=$ARTIFACT_ID" \
            -f "pages_build_version=$GITHUB_SHA" -f "oidc_token=$oidc_token")
          deploy_id=$(jq -er '.id' <<< "$deployment")
          page_url=$(jq -er '.page_url' <<< "$deployment")
          for attempt in {1..120}; do
            status=$(gh api "$pages/$deploy_id" --jq '.status') || status='unknown_status'
            case "$status" in
              succeed)
                echo "page_url=$page_url" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              deployment_failed|deployment_perms_error|deployment_content_failed|deployment_cancelled|deployment_lost)
                echo "Pages deployment failed: $status" >&2
                exit 1
                ;;
            esac
            sleep 5
          done
          echo 'Timed out waiting for the Pages deployment.' >&2
          exit 1
