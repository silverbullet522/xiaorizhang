name: Build iPhone trial

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/ios-trial.yml
      - capacitor.config.json
      - package.json
      - pnpm-lock.yaml
      - 'ios/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test
      - run: pnpm ios:sync
      - name: Build for iPhone
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/xiaorizhang" \
            CODE_SIGNING_ALLOWED=NO CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" build
      - name: Package iOS application
        run: |
          app="$RUNNER_TEMP/xiaorizhang/Build/Products/Release-iphoneos/App.app"
          test -x "$app/App"
          test -f "$app/public/app.js"
          test -f "$app/public/vendor/xlsx.full.min.js"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist"
          package="$RUNNER_TEMP/ipa"
          mkdir -p "$package/Payload"
          ditto "$app" "$package/Payload/App.app"
          ditto -c -k --norsrc --keepParent "$package/Payload" "$package/Xiaorizhang-trial.ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: Xiaorizhang-iPhone-trial
          path: ${{ runner.temp }}/ipa/Xiaorizhang-trial.ipa
          if-no-files-found: error
          retention-days: 30
